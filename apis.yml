aid: scratchpay
name: Scratchpay
description: >-
  Scratchpay (Scratch Financial, Inc., NMLS ID 1582666) is a digital payment and
  financing platform for veterinary and human healthcare. Practices offer borrowers
  Scratch Pay installment plans ($200-$10,000 over 12-24 months, 0-36% APR) with no
  hidden fees and a soft credit check, plus Scratch Checkout payment processing and
  Scratch Comms patient communications. Over 12,000 veterinary hospitals across the
  U.S. and Canada integrate Scratch, which pays practices up front and collects from
  borrowers. Scratchpay exposes a partner/borrower API (published as archived OpenAPI
  on GitHub) for submitting loan applications and receiving an asynchronous
  approve/decline decision via a partner callback. Backed by Norwest Venture Partners.
