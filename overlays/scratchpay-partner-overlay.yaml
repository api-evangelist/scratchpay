overlay: 1.0.0
info:
  title: API Evangelist enhancements for Scratchpay Partner-API
  version: 1.0.0
extends: openapi/scratchpay-partner-1.0.0-apis-swagger.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: true
      x-apievangelist-note: >
        Partner-hosted callback surface — Scratchpay POSTs the loan decision to the
        partner's endpoint. Modeled as a webhook in asyncapi/scratchpay-partner-webhooks.yml.
  - target: $.paths['/application/{loanUniqueId}/result'].post
    update:
      operationId: sendApplicationResult
